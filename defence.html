function csNext(){if(!cs)return;if(cs.i>=cs.L.length)return csEnd();const s=cs.L[cs.i++],me=cs,tts=P.voice&&!me.silent&&window.speechSynthesis;me.ph=me.i;$('#cap').textContent=s;let done=false;

function enterLevel(i){LI=i;plan=[];ang=0;$('#ag').value=0;$('#agv').textContent='0°';sel={ty:lv().types[0],op:1};pt=0;playing=false;cs=null;window.speechSynthesis&&speechSynthesis.cancel();recalc();chips();buildGhost();lvChips();$('#bh').textContent='';setStage('alert');const id=i;setTimeout(()=>{if(stage=='alert'&&LI==id)startAnalysis()},2200)}

// ---------- radar and timeline ----------
const rc=$('#rd'),rx=rc.getContext('2d'),tl=$('#tl'),tx=tl.getContext('2d');

rx.fillStyle='#ff5a4a';rx.beginPath();rx.arc(X(q.tp[0]),Y(q.tp[1]),5,0,7);rx.fill();rx.strokeStyle='rgba(255,90,74,.4)';rx.setLineDash([4,5]);rx.beginPath();rx.moveTo(X(q.tp[0]),Y(q.tp[1]));rx.lineTo(X(lv().p[0]),Y(lv().p[1]));rx.stroke();rx.setLineDash([])}
