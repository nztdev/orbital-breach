function setStage(s){stage=s;document.querySelectorAll('#stg span').forEach(x=>x.classList.toggle('on',x.dataset.s==s));
if(s=='gate'||s=='alert'){PN.forEach(hide);hide('pD')}
if(s=='analysis'){hide('pB');show('pR',true);show('pJ',false)}
if(s=='plan'){show('pR',true);show('pJ',true);show('pB',false);$('#pB').classList.remove('running');armed=true;clk=90}
if(s=='run'){show('pR',true);show('pJ',true);show('pB',false);$('#pB').classList.add('running');armed=false}
if(s=='debrief'){show('pB',true);show('pD',false)}preview()}
// ---------- analysis briefing ----------
function startAnalysis(){const m=lv();setStage('analysis');
cs={el:0,i:0,ph:0,silent:false,L:['Good day, Commander. I have a live feed of the incoming threat: the '+m.n+'.','It approaches from bearing '+m.bear.replace('°',' degrees')+', with impact expected in '+m.eta+' seconds.',m.cls,m.h[P.tier].replace('{E}',m.eta)]};
if(P.tier==0)cs.L.push('I have taken the liberty of marking a recommended layout on your display. Good luck, Commander.');fcp.set(0,12,14);flk.set(0,0,0);$('#jrp').hidden=true;csNext()}
function csNext(){if(!cs)return;if(cs.i>=cs.L.length)return csEnd();const s=cs.L[cs.i++],me=cs,tts=P.voice&&!me.silent&&window.speechSynthesis;me.ph=me.i;$('#cap').textContent=s;let done=false;
const go=()=>{if(done||cs!==me)return;done=true;clearTimeout(me.to);talk=false;me.to=setTimeout(csNext,450)};me.go=go;me.cur=s;me.to=setTimeout(go,tts?s.length*140+3000:Math.max(3000,s.length*70));
if(tts){speechSynthesis.cancel();const u=ut(s);u.onend=u.onerror=go;speechSynthesis.speak(u)}else talkUntil=performance.now()+s.length*65}
function csEnd(){if(cs)clearTimeout(cs.to);cs=null;talk=false;window.speechSynthesis&&speechSynthesis.cancel();$('#jrp').hidden=false;setStage('plan')}
// ---------- levels ----------
function recalc(){res=sim(lv(),plan);pt=Math.min(pt,res.end);dirty=true;$('#lc').textContent=plan.length+'/'+LIM+' launched';$('#dp').disabled=plan.length>=LIM;$('#pl').disabled=$('#cm').disabled=!plan.length;$('#pB').classList.toggle('has',plan.length>0)}
function mark(){document.querySelectorAll('.hcard').forEach(c=>c.classList.toggle('on',sel[c.dataset.k]==c.dataset.i))}
function chips(){const mk=(h,k,i,n,sm)=>{const d=document.createElement('div');d.className='hcard';d.dataset.k=k;d.dataset.i=i;d.innerHTML='<span>'+n+'<small>'+sm+'</small></span>';d.onclick=()=>{sel[k]=i;mark();preview()};$(h).append(d)};
$('#ds').innerHTML='';$('#os').innerHTML='';lv().types.forEach(t=>mk('#ds','ty',t,DT[t].n,['vs asteroids','vs debris','vs storms'][t]));OP.forEach((o,i)=>mk('#os','op',i,o[0],o[4]));mark()}
function lvChips(){$('#lvs').innerHTML='';LV.forEach((m,i)=>{const b=document.createElement('button'),open=i==0||P.stars[i-1]>0;b.textContent='L'+(i+1)+(P.stars[i]?' '+'★'.repeat(P.stars[i]):'')+(open?'':' 🔒');b.disabled=!open;b.className=i==LI?'on':'';b.onclick=()=>enterLevel(i);$('#lvs').append(b)})}
function prep(i){LI=i;plan=[];ang=0;$('#ag').value=0;$('#agv').textContent='0°';sel={ty:lv().types[0],op:1};pt=0;playing=false;cs=null;talk=false;window.speechSynthesis&&speechSynthesis.cancel();recalc();chips();buildGhost();lvChips()}
function enterLevel(i){prep(i);setStage('alert');const id=i,al=$('#al');al.classList.remove('on');void al.offsetWidth;al.classList.add('on');siren();
setTimeout(()=>{if(stage=='alert'&&LI==id)speak('Alert. Unidentified contact detected.')},1800);
setTimeout(()=>{al.classList.remove('on');if(stage=='alert'&&LI==id)startAnalysis()},4300)}
function report(commit){const m=lv(),l=res.st[res.st.length-1],cov=res.st.reduce((s,q)=>s+q.inr.filter(Boolean).length*.1,0),need=m.hp/Math.max(...DT.map(d=>d.d[m.k]));
let s=(res.win?(commit?'Splendid work, Commander. ':'Dry run complete. ')+'The threat was neutralised at '+l.t.toFixed(0)+' seconds.':(commit?'Regrettably, Commander, ':'Dry run complete. ')+'we would suffer impact at '+res.hit.toFixed(0)+' seconds, with '+Math.round(l.hp/m.hp*100)+' percent of the threat intact.')+' Coverage totalled '+cov.toFixed(1)+' seconds, against roughly '+need.toFixed(0)+' required.';
if(!res.win)s+=cov==0?' Nothing engaged at all, which suggests the defender type may not suit this threat.':' Might I suggest adding coverage where it closes on Earth, or adjusting your start angles?';return s}
function run(commit){if(!plan.length){say('Forgive me, Commander, but no defenders have been deployed.');return}pt=0;playing=true;commitRun=commit;if(commit)setStage('run')}
function finish(){const txt=report(commitRun);say(txt);if(!commitRun)return;let st=0;if(res.win){st=plan.length<=3?3:2;P.stars[LI]=Math.max(P.stars[LI],st);save();lvChips()}
setStage('debrief');$('#dt').textContent=res.win?'EARTH SAFE':'IMPACT';$('#ds2').textContent=res.win?'★'.repeat(st)+'☆'.repeat(3-st):'';$('#dx').textContent=res.win?(LI<2?'The next level has been unlocked.':'Training complete. Conquest Campaign awaits.'):'The threat reached Earth. Adjust your defences and try again.';$('#dn').hidden=!(res.win&&LI<2)}
// ---------- wiring ----------
$('#ag').oninput=e=>{ang=+e.target.value;$('#agv').textContent=ang+'°';preview()};
$('#dp').onclick=()=>{plan.push({ty:sel.ty,op:sel.op,ang:ang*A});recalc();preview()};
$('#un').onclick=()=>{plan.pop();playing=false;recalc();preview()};
$('#pl').onclick=()=>run(false);$('#cm').onclick=()=>run(true);$('#sc').oninput=e=>{playing=false;pt=e.target.value/1000*res.end};
$('#gear').onclick=()=>$('#set').classList.toggle('on');$('#dr').onclick=()=>enterLevel(LI);$('#dn').onclick=()=>enterLevel(LI+1);
$('#jsk').onclick=()=>{if(cs)csEnd()};$('#jsv').onclick=stopVoice;$('#jrp').onclick=()=>{if(stage=='plan')startAnalysis()};
$('#jmu').onclick=()=>{P.voice=!P.voice;$('#jmu').textContent=P.voice?'🔊':'🔇';save();if(!P.voice){talk=false;window.speechSynthesis&&speechSynthesis.cancel()}};
$('#tier').onchange=e=>{P.tier=e.target.selectedIndex;save();buildGhost()};$('#ck').onchange=e=>{P.clk=e.target.checked;save();clk=90};
$('#tier').selectedIndex=P.tier;$('#ck').checked=!!P.clk;$('#jmu').textContent=P.voice?'🔊':'🔇';
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,yw]});addEventListener('pointermove',e=>{if(drag&&e.buttons)yw=drag[1]-(e.clientX-drag[0])*.008});addEventListener('pointerup',()=>drag=null);
// ---------- radar, timeline, waveform ----------
const rc=$('#rd'),rx=rc.getContext('2d'),tl=$('#tl'),tx=tl.getContext('2d'),wv=$('#wv'),wx=wv.getContext('2d');
function radar(q,t){const w=rc.width,S=w/2/9.4,cx=w/2,X=v=>cx+v*S,Y=v=>cx-v*S,mini=$('#pR').classList.contains('min');rx.clearRect(0,0,w,w);rx.fillStyle='rgba(4,16,32,.95)';rx.fillRect(0,0,w,w);rx.lineWidth=mini?3:1.5;rx.strokeStyle='rgba(76,201,255,.2)';for(let r=2;r<=8;r+=2){rx.beginPath();rx.arc(cx,cx,r*S,0,7);rx.stroke()}
const a=t*1.6;rx.fillStyle='rgba(76,201,255,.14)';rx.beginPath();rx.moveTo(cx,cx);rx.arc(cx,cx,w/2,a-.6,a);rx.fill();rx.strokeStyle='rgba(76,201,255,.7)';rx.beginPath();rx.moveTo(cx,cx);rx.lineTo(cx+Math.cos(a)*w/2,cx+Math.sin(a)*w/2);rx.stroke();
plan.forEach(it=>{rx.strokeStyle=DT[it.ty].c+'77';rx.beginPath();orbitPts(it).forEach((p,i)=>i?rx.lineTo(X(p[0]),Y(p[1])):rx.moveTo(X(p[0]),Y(p[1])));rx.stroke()});
rx.fillStyle='#2a7fd0';rx.beginPath();rx.arc(cx,cx,S,0,7);rx.fill();
plan.forEach((it,i)=>{const p=q.sh[i];if(!p)return;rx.fillStyle=DT[it.ty].c;if(q.inr[i]){rx.globalAlpha=.25;rx.beginPath();rx.arc(X(p[0]),Y(p[1]),DT[it.ty].rg*S,0,7);rx.fill();rx.globalAlpha=1}rx.beginPath();rx.arc(X(p[0]),Y(p[1]),mini?9:5,0,7);rx.fill()});
rx.fillStyle='#ff5a4a';rx.beginPath();rx.arc(X(q.tp[0]),Y(q.tp[1]),mini?12:6,0,7);rx.fill()}
function tline(){const m=lv(),dp=Math.min(devicePixelRatio||1,2),w=tl.clientWidth;if(!w)return;if(tl.width!=Math.round(w*dp)){tl.width=Math.round(w*dp);tl.height=46*dp;tx.setTransform(dp,0,0,dp,0,0)}const h=46,E=res.end||1,X=t=>t/E*w;tx.clearRect(0,0,w,h);
tx.fillStyle='rgba(255,255,255,.12)';tx.beginPath();tx.moveTo(0,h);res.st.forEach(q=>tx.lineTo(X(q.t),h-q.hp/m.hp*h));tx.lineTo(X(E),h);tx.fill();
plan.forEach((it,i)=>{tx.fillStyle=DT[it.ty].c;res.st.forEach(q=>{if(q.inr[i])tx.fillRect(X(q.t),3+i*9,Math.max(1,w/res.st.length+.5),6)})});tx.fillStyle='#f55';tx.fillRect(X(pt),0,2,h)}
function wave(now){const w=wv.width,h=wv.height,on=talk||now<talkUntil;wx.clearRect(0,0,w,h);wx.fillStyle=on?'#4cc9ff':'rgba(76,201,255,.35)';for(let i=0;i<14;i++){const a=on?.2+.8*Math.abs(Math.sin(now*.011+i*.9)*Math.sin(now*.0063+i*1.7)):.07,bh=Math.max(3,a*h);wx.fillRect(i*(w/14)+2,(h-bh)/2,w/14-5,bh)}}
// ---------- loop ----------
function thr(m,tp,t,on){ast.visible=on&&m.k==0;swp.visible=on&&m.k==1;stm.visible=on&&m.k==2;mrk.visible=on;const X=tp[0],Z=-tp[1];ast.position.set(X,0,Z);ast.rotation.x+=.02;stm.position.set(X,0,Z);stm.scale.setScalar(1+.05*Math.sin(t*6));mrk.position.set(X,0,Z);mrk.scale.setScalar(.7+.08*Math.sin(t*5)+(m.k==2?1.4:m.k==1?.8:0));
const a=swp.geometry.attributes.position;swm.forEach((o,i)=>a.setXYZ(i,X+o[0],Math.sin(i*7)*.3,Z-o[1]));a.needsUpdate=true}
function feed(tp,fin,dt){const p=$('#pJ');if(p.classList.contains('off')||p.classList.contains('min'))return;const b=$('#feed').getBoundingClientRect();if(b.width<20)return;const m=lv(),d=Math.hypot(...m.v),ux=m.v[0]/d,uy=m.v[1]/d,k=1-Math.exp(-dt*1.6);
fcp.lerp(fin?V(0,9,11):V(tp[0]-uy*3-ux*1.5,1.6,-(tp[1]+ux*3-uy*1.5)),k);flk.lerp(fin?V():V(tp[0],0,-tp[1]),k);fcam.position.copy(fcp);fcam.lookAt(flk);fcam.aspect=b.width/b.height;fcam.updateProjectionMatrix();
const y=innerHeight-b.bottom;r3.setScissorTest(true);r3.setViewport(b.left,y,b.width,b.height);r3.setScissor(b.left,y,b.width,b.height);r3.render(s3,fcam);r3.setScissorTest(false);r3.setViewport(0,0,innerWidth,innerHeight)}
let lt=performance.now();
function frame(ms){requestAnimationFrame(frame);const dt=Math.min((ms-lt)/1000,.1),t=ms/1000;lt=ms;const m=lv();EARTH.tick(dt);
if(playing){pt+=dt;if(pt>=res.end){pt=res.end;playing=false;finish()}$('#sc').value=pt/res.end*1000}
const cl=P.clk&&armed&&stage=='plan';if(cl){clk-=dt;if(clk<=0){clk=0;if(plan.length)run(true);else clk=90}}$('#clk').textContent=cl?Math.floor(clk/60)+':'+String(Math.floor(clk%60)).padStart(2,'0'):'';
let q,fin=false;if(cs){cs.el+=dt;const ts=Math.min(m.eta*.8,cs.el*1.5);q={tp:[m.p[0]+m.v[0]*ts,m.p[1]+m.v[1]*ts],sh:[],inr:[],hp:m.hp,t:ts};fin=cs.ph>=4}else q=res.st[Math.min(res.st.length-1,Math.round(pt/.1))];
const gone=!cs&&res.win&&q===res.st[res.st.length-1];thr(m,q.tp,t,!gone&&stage!='gate');if(dirty)rebuild();
$('#tel').textContent='RNG '+Math.hypot(...q.tp).toFixed(1)+' · SPD '+Math.hypot(...m.v).toFixed(2)+' · T-'+Math.max(0,m.eta-q.t).toFixed(0)+'s';
sh3.forEach((s,i)=>{const p=q.sh[i];if(!p)return;s.d.position.set(p[0],0,-p[1]);s.rg.position.copy(s.d.position);s.rg.visible=s.bm.visible=q.inr[i];if(q.inr[i]){const a=s.bm.geometry.attributes.position;a.setXYZ(0,p[0],0,-p[1]);a.setXYZ(1,q.tp[0],0,-q.tp[1]);a.needsUpdate=true}});
gh.visible=P.tier==0&&(stage=='plan'||fin);gh.userData.gd.forEach(o=>{const p=posAt(o.it,t);o.d.position.set(p[0],0,-p[1])});pv.visible=stage=='plan';
if(!drag&&!playing)yw+=dt*.03;const R=narrow()?17:13,el=.62;cam.position.set(Math.sin(yw)*R*Math.cos(el),R*Math.sin(el),Math.cos(yw)*R*Math.cos(el));cam.lookAt(0,0,0);
const j=$('#pJ'),pb=$('#pB'),jh=!j.classList.contains('off')&&!j.classList.contains('min')&&narrow()?j.getBoundingClientRect().bottom-44:0,bh=pb.classList.contains('off')?0:pb.getBoundingClientRect().height,tgt=(bh-jh)/(narrow()?2:2.6),oy=cam.userData.oy||0;
cam.userData.oy=oy+(tgt-oy)*(1-Math.exp(-dt*6));cam.setViewOffset(innerWidth,innerHeight,0,cam.userData.oy,innerWidth,innerHeight);
r3.render(s3,cam);feed(q.tp,fin,dt);holo(t);radar(q,t);if(pb.classList.contains('has')&&!pb.classList.contains('off'))tline();wave(ms)}
// ---------- boot: tap-to-engage gate (a tap is required for voice and sound) ----------
const first=P.stars.findIndex(s=>!s);prep(first<0?0:first);setStage('gate');$('#gl').textContent='LEVEL '+(LI+1)+' · '+lv().n.toUpperCase();
$('#go').onclick=()=>{unlock();$('#gate').classList.add('off');enterLevel(LI)};
requestAnimationFrame(frame);
</script></body></html>
